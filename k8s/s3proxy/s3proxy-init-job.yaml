apiVersion: batch/v1
kind: Job
metadata:
  name: s3proxy-init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-s3proxy
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z s3proxy 8000; do echo waiting for s3proxy; sleep 2; done']
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /root/.mc/certs/CAs
              cp /mnt/ca/ca.crt /root/.mc/certs/CAs/lab-ca.crt
              until mc alias set s3proxy https://s3proxy:8000 admin password; do
                echo '...waiting...'
                sleep 1
              done
              mc mb -p s3proxy/warehouse
          volumeMounts:
            - name: lab-ca
              mountPath: /mnt/ca
              readOnly: true
      volumes:
        - name: lab-ca
          secret:
            secretName: lab-ca-secret
