# Helm values for confluentinc/confluent-manager-for-apache-flink (~2.3.0).
# Enables HTTPS on the CMF REST API and configures TLS truststore so CMF
# can validate Kafka, Schema Registry and Flink JobManager certificates
# issued by the lab CA (cert-manager ClusterIssuer "lab-ca-issuer").
#
# Required secrets (created by labs-src/k8s/cert-manager/component-certs.yaml):
#   - cmf-tls                  : server cert + key + truststore.jks for CMF
#   - lab-truststore-password  : password for the JKS keystore/truststore
#   - lab-ca-secret            : copied into confluent ns by setup-all.sh

cmf:
  sql:
    production: false

# Expose CMF REST API over HTTPS only
service:
  type: ClusterIP
  port: 8443

# CMF server-side TLS (mutual TLS NOT required for the lab)
tls:
  enabled: true
  # Use the cert-manager-issued JKS bundle directly
  keystoreSecretRef: cmf-tls
  keystoreType: JKS
  keystoreFileName: keystore.jks
  truststoreSecretRef: cmf-tls
  truststoreType: JKS
  truststoreFileName: truststore.jks
  # Password held in the lab-truststore-password Secret (key: "password")
  passwordSecretRef:
    name: lab-truststore-password
    keystoreKey: password
    truststoreKey: password

# Mount the CA bundle so CMF trusts the lab-issued certs of every
# downstream service it talks to (Kafka, SR, Flink JobManager pods).
extraVolumes:
  - name: lab-ca
    secret:
      secretName: lab-ca-secret
extraVolumeMounts:
  - name: lab-ca
    mountPath: /mnt/ca
    readOnly: true

# JVM truststore for Java HTTP clients used inside CMF
javaOpts:
  - "-Djavax.net.ssl.trustStore=/mnt/cmf-tls/truststore.jks"
  - "-Djavax.net.ssl.trustStorePassword=changeit"
  - "-Djavax.net.ssl.trustStoreType=JKS"

# Default catalog/database that CMF auto-creates point at the SSL endpoints
defaults:
  kafkaBootstrap: kafka.confluent.svc.cluster.local:9071
  kafkaSecurityProtocol: SSL
  schemaRegistryUrl: https://schemaregistry.confluent.svc.cluster.local:8081
