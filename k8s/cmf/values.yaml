# Helm values for confluentinc/confluent-manager-for-apache-flink (2.3.x).
#
# This chart wires `.Values.cmf.ssl.*` directly into the rendered cmf-config.yaml
# under `server.ssl.*` (Spring Boot SSL config) — see the chart's
# templates/configmap.yaml. So any Spring Boot `server.ssl.*` key set under
# `cmf.ssl` here turns into a real CMF TLS listener.
#
# The chart's Service template hardcodes `port: 80, targetPort: 8080`, but that
# is just network forwarding — once CMF speaks HTTPS on its container port 8080
# (via the cmf.ssl block below), https://cmf-service:80 is the correct in-cluster
# URL. External access via portfw maps localhost:8080 -> service:80 and the URL
# stays https://localhost:8080.
#
# Inbound TLS = `cmf.ssl` here. Outbound TLS (CMF -> Kafka:9071 SSL,
# CMF -> Schema Registry:8081 HTTPS) = JVM truststore via JAVA_TOOL_OPTIONS
# (env var, picked up by every JVM in the container regardless of how the
# entrypoint launches it). `jvmArgs` is set as a belt-and-suspenders fallback
# in case the container entrypoint passes it as a JVM arg.
#
# Required Secrets (from labs-src/k8s/cert-manager/component-certs.yaml):
#   - cmf-tls : keystore.jks (server cert) + truststore.jks (lab CA)
#   - lab-truststore-password : holds the JKS password "changeit"

cmf:
  sql:
    production: false

  # Inbound: CMF REST API listener speaks HTTPS on container port 8080.
  ssl:
    enabled: true
    key-store: /mnt/cmf-tls/keystore.jks
    key-store-password: changeit
    key-store-type: JKS

# Mount the cert-manager-issued cmf-tls Secret so both the SSL listener
# (keystore.jks) and the JVM truststore (truststore.jks) can read from it.
mountedVolumes:
  volumes:
    - name: cmf-tls
      secret:
        secretName: cmf-tls
  volumeMounts:
    - name: cmf-tls
      mountPath: /mnt/cmf-tls
      readOnly: true

# Outbound TLS: every JVM client inside CMF (Kafka producer/consumer to :9071,
# Schema Registry HTTP client to :8081) reads JAVA_TOOL_OPTIONS automatically.
extraEnv:
  - name: JAVA_TOOL_OPTIONS
    value: "-Djavax.net.ssl.trustStore=/mnt/cmf-tls/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=JKS"

# Same flags via the chart's `jvmArgs` arg (single string, passed to the
# entrypoint as the second CLI arg). Harmless if the entrypoint ignores it.
jvmArgs: "-Djavax.net.ssl.trustStore=/mnt/cmf-tls/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=JKS"
