metadata:
  name: alertmanager-tls
  namespace: confluent
spec:
  secretName: alertmanager-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  commonName: alertmanager
  dnsNames:
    - controlcenter
    - controlcenter.confluent
    - controlcenter.confluent.svc.cluster.local
    - "*.controlcenter.confluent.svc.cluster.local"
  issuerRef:
    name: lab-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# Client cert used by Kafka/KRaft/CC to push metrics into Prometheus
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prometheus-client-tls
  namespace: confluent
spec:
  secretName: prometheus-client-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  commonName: prometheus-client
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: lab-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# Client cert used by ControlCenter to talk to Alertmanager
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alertmanager-client-tls
  namespace: confluent
spec:
  secretName: alertmanager-client-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  commonName: alertmanager-client
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: lab-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# Truststore secret consumed by KRaft/Kafka pods (mounted at /mnt/sslcerts)
# Built from the lab CA so brokers can trust the Prometheus OTLP endpoint.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prometheus-exporter-truststore
  namespace: confluent
spec:
  secretName: prometheus-exporter-truststore
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  commonName: prometheus-exporter-truststore
  keystores:
    jks:
      create: true
      passwordSecretRef:
        name: lab-truststore-password
        key: password
  issuerRef:
    name: lab-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# Password used for the JKS truststore generated above
apiVersion: v1
kind: Secret
metadata:
  name: lab-truststore-password
  namespace: confluent
type: Opaque
stringData:
  password: changeit
---
