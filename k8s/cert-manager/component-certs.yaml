---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kraftcontroller-tls
  namespace: confluent
spec:
  secretName: kraftcontroller-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  commonName: kraftcontroller
  dnsNames:
    - kraftcontroller
    - kraftcontroller.confluent
    - kraftcontroller.confluent.svc.cluster.local
    - "*.kraftcontroller.confluent.svc.cluster.local"
    - "*.kraftcontroller-0-internal.confluent.svc.cluster.local"
  issuerRef:
    name: lab-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-tls
  namespace: confluent
spec:
  secretName: kafka-tls
