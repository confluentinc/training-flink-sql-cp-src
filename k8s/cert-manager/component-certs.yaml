kind: Certificate
metadata:
  name: flink-jm-tls
  namespace: confluent
spec:
  secretName: flink-jm-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  commonName: flink-jm
  dnsNames:
    - training-compute-pool-rest
    - training-compute-pool-rest.confluent
    - training-compute-pool-rest.confluent.svc.cluster.local
    - "*.training-compute-pool-rest.confluent.svc.cluster.local"
    - training-compute-pool-dedicated-rest
    - training-compute-pool-dedicated-rest.confluent
    - training-compute-pool-dedicated-rest.confluent.svc.cluster.local
