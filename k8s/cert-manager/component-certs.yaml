    algorithm: RSA
    size: 2048
  commonName: kafka
  dnsNames:
    - kafka
    - kafka.confluent
    - kafka.confluent.svc.cluster.local
    - "*.kafka.confluent.svc.cluster.local"
    - "*.kafka-0-internal.confluent.svc.cluster.local"
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: lab-ca-issuer
